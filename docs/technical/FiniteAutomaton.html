<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">AirLang Finite Automaton</text>
  
  <!-- Legend -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Legend:</text>
    <circle cx="20" cy="20" r="8" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="35" y="25" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Non-accepting state</text>
    <circle cx="20" cy="40" r="8" fill="#e8f5e8" stroke="#27ae60" stroke-width="2"/>
    <text x="35" y="45" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Accepting state (no retract)</text>
    <circle cx="20" cy="60" r="8" fill="#fff3cd" stroke="#f39c12" stroke-width="2"/>
    <text x="35" y="65" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Accepting state (with retract)</text>
    <circle cx="20" cy="80" r="8" fill="#f8d7da" stroke="#e74c3c" stroke-width="2"/>
    <text x="35" y="85" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">Error state</text>
  </g>
  
  <!-- Character class legend -->
  <g transform="translate(300, 50)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Character Classes:</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">L: [A-z], D: [0-9], U: _, LP: (, Q: ", E: SEOF, C: %, O: other, RP: ), DOT: ., SEMI: ;, MINUS: -, SLCOM: ^^, SQ: '</text>
  </g>
  
  <!-- States -->
  <!-- S0: Start state -->
  <g id="s0">
    <circle cx="100" cy="200" r="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S0</text>
    <text x="100" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">START</text>
    <!-- Start arrow -->
    <path d="M 60 200 L 80 200" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- S1: Identifier building -->
  <g id="s1">
    <circle cx="300" cy="200" r="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="300" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S1</text>
    <text x="300" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ID BUILD</text>
  </g>
  
  <!-- S2: Method ID (MVID) -->
  <g id="s2">
    <circle cx="500" cy="120" r="20" fill="#e8f5e8" stroke="#27ae60" stroke-width="2"/>
    <text x="500" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S2</text>
    <text x="500" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">MVID</text>
  </g>
  
  <!-- S3: Keyword -->
  <g id="s3">
    <circle cx="500" cy="200" r="20" fill="#fff3cd" stroke="#f39c12" stroke-width="2"/>
    <text x="500" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S3</text>
    <text x="500" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">KEY</text>
  </g>
  
  <!-- S4: String literal building -->
  <g id="s4">
    <circle cx="300" cy="350" r="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="300" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S4</text>
    <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">STR BUILD</text>
  </g>
  
  <!-- S5: String literal -->
  <g id="s5">
    <circle cx="500" cy="350" r="20" fill="#e8f5e8" stroke="#27ae60" stroke-width="2"/>
    <text x="500" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S5</text>
    <text x="500" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">SL</text>
  </g>
  
  <!-- S6: Comment building -->
  <g id="s6">
    <circle cx="300" cy="500" r="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="300" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S6</text>
    <text x="300" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">COM BUILD</text>
  </g>
  
  <!-- S7: Comment -->
  <g id="s7">
    <circle cx="500" cy="500" r="20" fill="#e8f5e8" stroke="#27ae60" stroke-width="2"/>
    <text x="500" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S7</text>
    <text x="500" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">COM</text>
  </g>
  
  <!-- S10: Integer literal -->
  <g id="s10">
    <circle cx="700" cy="200" r="20" fill="#fff3cd" stroke="#f39c12" stroke-width="2"/>
    <text x="700" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S10</text>
    <text x="700" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">IL</text>
  </g>
  
  <!-- S11: Parenthesis handling -->
  <g id="s11">
    <circle cx="900" cy="120" r="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="900" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S11</text>
    <text x="900" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">PAREN</text>
  </g>
  
  <!-- S12: Decimal point -->
  <g id="s12">
    <circle cx="900" cy="200" r="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="900" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S12</text>
    <text x="900" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">DECIMAL</text>
  </g>
  
  <!-- S13: Float literal -->
  <g id="s13">
    <circle cx="1100" cy="200" r="20" fill="#fff3cd" stroke="#f39c12" stroke-width="2"/>
    <text x="1100" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S13</text>
    <text x="1100" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">FL</text>
  </g>
  
  <!-- S14: Date literal building -->
  <g id="s14">
    <circle cx="300" cy="650" r="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="300" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S14</text>
    <text x="300" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">DATE BUILD</text>
  </g>
  
  <!-- S15: Date literal -->
  <g id="s15">
    <circle cx="500" cy="650" r="20" fill="#e8f5e8" stroke="#27ae60" stroke-width="2"/>
    <text x="500" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S15</text>
    <text x="500" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">DATE</text>
  </g>
  
  <!-- S18: Single letter + hyphen -->
  <g id="s18">
    <circle cx="700" cy="350" r="20" fill="white" stroke="#3498db" stroke-width="2"/>
    <text x="700" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S18</text>
    <text x="700" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">SINGLE+'-'</text>
  </g>
  
  <!-- S19: Aircraft ID complete -->
  <g id="s19">
    <circle cx="900" cy="350" r="20" fill="#fff3cd" stroke="#f39c12" stroke-width="2"/>
    <text x="900" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">S19</text>
    <text x="900" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">AIRCRAFT ID</text>
  </g>
  
  <!-- Error states -->
  <!-- ESNR: Error state no retract -->
  <g id="esnr">
    <circle cx="1100" cy="450" r="20" fill="#f8d7da" stroke="#e74c3c" stroke-width="2"/>
    <text x="1100" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">ESNR</text>
    <text x="1100" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ERR (NR)</text>
  </g>
  
  <!-- ESWR: Error state with retract -->
  <g id="eswr">
    <circle cx="1100" cy="550" r="20" fill="#f8d7da" stroke="#e74c3c" stroke-width="2"/>
    <text x="1100" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">ESWR</text>
    <text x="1100" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">ERR (WR)</text>
  </g>
  
  <!-- Key transitions -->
  <!-- S0 to S1 on letters -->
  <path d="M 120 200 L 280 200" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="200" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">L</text>
  
  <!-- S0 to S10 on digits -->
  <path d="M 120 190 Q 400 100 680 190" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="400" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">D</text>
  
  <!-- S0 to S4 on quote -->
  <path d="M 120 210 Q 200 280 280 340" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Q</text>
  
  <!-- S0 to S6 on % -->
  <path d="M 120 220 Q 200 380 280 490" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">C</text>
  
  <!-- S0 to S7 on ^^ -->
  <path d="M 120 230 Q 200 450 280 520" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="200" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">SLCOM</text>
  
  <!-- S0 to S14 on single quote -->
  <path d="M 120 240 Q 200 480 280 640" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="200" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">SQ</text>
  
  <!-- S1 self-loop -->
  <path d="M 280 180 Q 300 160 320 180" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="300" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">L,D,U</text>
  
  <!-- S1 to S11 on ( -->
  <path d="M 320 200 Q 600 100 880 120" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">LP</text>
  
  <!-- S1 to S3 on various -->
  <path d="M 320 200 L 480 200" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Q,E,C,O,RP,SEMI</text>
  
  <!-- S1 to S18 on - -->
  <path d="M 320 210 Q 500 280 680 340" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="500" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">MINUS</text>
  
  <!-- S4 self-loop -->
  <path d="M 280 330 Q 300 310 320 330" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="300" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">all except Q,E</text>
  
  <!-- S4 to S5 on quote -->
  <path d="M 320 350 L 480 350" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Q</text>
  
  <!-- S6 to S7 on ^^ -->
  <path d="M 320 500 L 480 500" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">SLCOM</text>
  
  <!-- S10 self-loop -->
  <path d="M 680 180 Q 700 160 720 180" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="700" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">D</text>
  
  <!-- S10 to S12 on dot -->
  <path d="M 720 200 L 880 200" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="800" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">DOT</text>
  
  <!-- S11 to S2 on ) -->
  <path d="M 880 120 Q 700 80 520 120" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)" fill="none"/>
  <text x="700" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">RP</text>
  
  <!-- S12 to S13 on digits -->
  <path d="M 920 200 L 1080 200" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="1000" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">D</text>
  
  <!-- S14 to S15 on single quote -->
  <path d="M 320 650 L 480 650" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="400" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">SQ</text>
  
  <!-- S18 to S19 on letters -->
  <path d="M 720 350 L 880 350" stroke="#2c3e50" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="800" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">L</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Token type labels -->
  <text x="50" y="950" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Token Types:</text>
  <text x="50" y="970" font-family="Arial, sans-serif" font-size="12" fill="#2c3e50">MVID: Method ID, KEY: Keyword, SL: String Literal, COM: Comment, IL: Integer Literal, FL: Float Literal, DATE: Date Literal</text>
  
</svg>
